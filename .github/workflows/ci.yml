name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install test toolchain
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang llvm ninja-build

      - name: Configure tests
        run: cmake -S . -B build-tests -G Ninja -DCMAKE_C_COMPILER=clang -DBUILD_TESTING=ON -DFM_V3_ENABLE_LLVM_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug

      - name: Build tests
        run: cmake --build build-tests --parallel

      - name: Prepare coverage profiles
        run: mkdir -p build-tests/coverage/profiles

      - name: Run tests
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build-tests/coverage/profiles/%p.profraw
        run: ctest --test-dir build-tests --output-on-failure

      - name: Generate LLVM coverage report
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          profiles=(build-tests/coverage/profiles/*.profraw)
          if ((${#profiles[@]} == 0)); then
            echo "::error::No LLVM coverage profiles were produced"
            exit 1
          fi

          report_dir=build-tests/coverage/report
          mkdir -p "$report_dir/html"
          profile_data="$report_dir/coverage.profdata"
          llvm-profdata merge -sparse "${profiles[@]}" -o "$profile_data"

          mapfile -t test_binaries < <(find build-tests/tests -maxdepth 1 -type f -executable -print | sort)
          if ((${#test_binaries[@]} == 0)); then
            echo "::error::No host test binaries were found"
            exit 1
          fi

          object_args=()
          for binary in "${test_binaries[@]:1}"; do
            object_args+=("--object=$binary")
          done
          source_filter='[/\\](tests|Drivers|Middlewares|Core)[/\\]|[/\\]LWIP[/\\]App[/\\]'

          llvm-cov report "${test_binaries[0]}" \
            "-instr-profile=$profile_data" \
            --show-branch-summary \
            "--ignore-filename-regex=$source_filter" \
            "${object_args[@]}" > "$report_dir/coverage-summary.txt"

          llvm-cov export "${test_binaries[0]}" \
            "-instr-profile=$profile_data" \
            --summary-only \
            "--ignore-filename-regex=$source_filter" \
            "${object_args[@]}" > "$report_dir/coverage.json"

          set +e
          python3 tests/check_coverage.py "$report_dir/coverage.json" 2>&1 | tee "$report_dir/coverage-gate.txt"
          coverage_gate_status=${PIPESTATUS[0]}
          set -e

          llvm-cov show "${test_binaries[0]}" \
            "-instr-profile=$profile_data" \
            --format=html \
            --output-dir="$report_dir/html" \
            "--ignore-filename-regex=$source_filter" \
            "${object_args[@]}"

          {
            echo '## Host test coverage'
            echo
            echo 'Detailed HTML report: artifact `fm_v3-llvm-coverage`.'
            echo
            cat "$report_dir/coverage-gate.txt"
            echo
            echo '```text'
            cat "$report_dir/coverage-summary.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$coverage_gate_status"

      - name: Upload LLVM coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fm_v3-llvm-coverage
          if-no-files-found: warn
          retention-days: 14
          path: |
            build-tests/coverage/report/coverage-summary.txt
            build-tests/coverage/report/coverage-gate.txt
            build-tests/coverage/report/html

  firmware-build:
    name: Firmware build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y cmake ninja-build gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi

      - name: Configure firmware
        run: cmake -S . -B build-firmware -G Ninja -DBUILD_TESTING=OFF -DCMAKE_C_COMPILER=arm-none-eabi-gcc -DCMAKE_CXX_COMPILER=arm-none-eabi-g++ -DCMAKE_ASM_COMPILER=arm-none-eabi-gcc

      - name: Build firmware
        run: cmake --build build-firmware --parallel

      - name: Upload firmware artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fm_v3-firmware
          if-no-files-found: error
          path: |
            build-firmware/fm_v3.elf
            build-firmware/fm_v3.bin
            build-firmware/fm_v3.hex
            build-firmware/fm_v3.map
